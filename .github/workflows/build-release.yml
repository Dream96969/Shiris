# Build and publish the Fabric distribution with the Gradle version pinned by gradle-wrapper.properties.

name: Release script

on:
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Run build with Gradle Wrapper
        run: ./gradlew build -Pbuild.release=true

      - name: Upload artifacts to Modrinth and GitHub
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # Shiris's own Modrinth project id goes in the repository variable MODRINTH_PROJECT_ID
          # (Settings > Secrets and variables > Actions > Variables), and the token in the secret
          # MODRINTH_TOKEN. The action skips a platform it has no token for (check this on the first
          # release run). The ids that were here, for Modrinth and CurseForge, were the upstream Iris
          # project's.
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true

          github-token: ${{ secrets.GITHUB_TOKEN }}

          files: build/libs/!(*-@(dev|sources|all)).jar

          version-type: release

          loaders: fabric quilt

          dependencies: sodium

          version-resolver: latest # Defaults to selecting the latest compatible version of Minecraft, using the tag from the fabric.mod.json
