# Block ID mapping. Block names are matched in the minecraft namespace.
#
# 10001 = foliage: plants that must not get an edge glow (see gbuffers_terrain / lib/gbuffers_vertex.glsl,
# constant HS_FOLIAGE_ID). Leaf blocks are intentionally not in this list.
block.10001=short_grass tall_grass fern large_fern \
	short_dry_grass tall_dry_grass bush firefly_bush wildflowers leaf_litter dead_bush \
	dandelion poppy blue_orchid allium azure_bluet red_tulip orange_tulip white_tulip pink_tulip \
	oxeye_daisy cornflower lily_of_the_valley wither_rose torchflower pitcher_plant \
	sunflower lilac rose_bush peony \
	oak_sapling spruce_sapling birch_sapling jungle_sapling acacia_sapling dark_oak_sapling \
	cherry_sapling pale_oak_sapling mangrove_propagule \
	sweet_berry_bush wheat carrots potatoes beetroots sugar_cane vine \
	seagrass tall_seagrass kelp kelp_plant \
	nether_sprouts crimson_roots warped_roots hanging_roots

# 10002 = water: gets a reduced share of the sun glint (GLINT_WATER_FACTOR), see gbuffers_water and
# lib/gbuffers_vertex.glsl (constant HS_WATER_ID).
block.10002=water

# Plain glass is moved from the cutout layer to the translucent layer. In the cutout layer its
# transparent texels are never drawn, so only the frame could show a sheen; in the translucent
# layer the whole pane is drawn and gbuffers_water can lay the sun glint across it.
layer.translucent=glass glass_pane
