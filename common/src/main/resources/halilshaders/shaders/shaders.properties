sun=true
moon=true
stars=true
separateAo=false

# Smoothed biome climate for the haze tint (lib/atmosphere.glsl). Written as an offset from a
# temperate biome (temperature 0.8, rainfall 0.4), so a value of 0 means "no tint" and a failure
# to evaluate these leaves the fog untinted.
# smooth(id, value, fadeUp, fadeDown): the fade values are in tenths of a second of half-life, so
# 30 settles over about ten seconds and crossing a biome border never makes the fog jump.
uniform.float.hsWarmth = smooth(1, temperature - 0.8, 30, 30)
uniform.float.hsHumidity = smooth(2, rainfall - 0.4, 30, 30)

# The first-person hand (gbuffers_hand) writes opaque data into all four buffers. The game draws the
# player's arm with a blended render type, and blending applies to every buffer at once: the sky light
# stored in the alpha of colortex1 would then act as a blend factor and mix the hand's normals into
# whatever is behind it. Blending off makes the hand replace what is behind it.
blend.gbuffers_hand=off

# Shadow pass (shadow.vsh, shadow.fsh, lib/shadows.glsl). The map size, its distance and the sun's tilt
# are constants in lib/settings.glsl. The player's own body casts a shadow as well; by default only
# other entities do. Water and glass are not drawn into the shadow map: only the opaque depth
# (shadowtex1) is read, and the game copies it before the translucent layer, so skipping that layer
# saves its draw time without changing what the pack reads.
shadowPlayer=true
shadowTranslucent=false

# The halo pass (composite.vsh, composite.fsh) draws at half the width and height, into the lower left
# quarter of colortex4; composite1.fsh reads it back and adds it to the scene. A quarter of the pixels
# run the expensive light loop. See the notes at the top of composite.fsh.
scale.composite=0.5
